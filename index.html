<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="description" content="Vive el cine sin límites en FILMBOX. Mira películas y series gratis en línea con los mejores estrenos, acción y suspenso.">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-dark: #06060a;
    --bg-card: #11111b;
    --primary-gradient: linear-gradient(135deg, #ff2a54 0%, #ff6b4a 100%);
    --accent-glow: rgba(255, 42, 84, 0.15);
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --glass-bg: rgba(17, 17, 27, 0.75);
    --glass-border: rgba(255, 255, 255, 0.06);
    --card-radius: 16px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Poppins', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Fondo decorativo sutil con gradiente ambiental */
  body::before {
    content: '';
    position: fixed;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 100vw;
    height: 60vh;
    background: radial-gradient(circle, rgba(255, 42, 84, 0.08) 0%, rgba(6, 6, 10, 0) 70%);
    pointer-events: none;
    z-index: -1;
  }

  /* HEADER ESTILO STREAMING PREMIUM (GLASSMORPHISM) */
  header {
    position: sticky;
    top: 0;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    padding: 16px 24px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    z-index: 100;
    transition: all 0.3s ease;
  }

  header .logo-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header .logo {
    font-family: 'Outfit', sans-serif;
    font-size: 28px;
    font-weight: 900;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -1.5px;
    position: relative;
    display: inline-block;
  }

  header .logo::after {
    content: '•';
    color: #ff6b4a;
    font-size: 28px;
    position: absolute;
    right: -10px;
    bottom: 2px;
  }

  /* Buscador Premium Rediseñado */
  .search-wrapper {
    position: relative;
    width: 100%;
    max-width: 450px;
  }

  .search-wrapper svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    fill: var(--text-muted);
    transition: fill 0.3s ease;
    pointer-events: none;
  }

  header input {
    width: 100%;
    padding: 12px 16px 12px 48px;
    border-radius: 50px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    outline: none;
    background: rgba(255, 255, 255, 0.05);
    color: #ffffff;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  header input::placeholder {
    color: var(--text-muted);
  }

  header input:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 42, 84, 0.5);
    box-shadow: 0 0 25px var(--accent-glow);
  }

  header input:focus + svg {
    fill: #ff2a54;
  }

  /* Marquee de Estrenos Premium */
  .marquee {
    width: 100%;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.03);
    border-bottom: 1px solid var(--glass-border);
    color: #ffffff;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 0;
    white-space: nowrap;
    letter-spacing: 0.5px;
  }

  .marquee span {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 20s linear infinite;
  }

  .marquee span strong {
    color: #ff2a54;
    font-weight: 700;
  }

  @keyframes scroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  /* Nuevo Carrusel Hero Ultra-Premium (Estricto Widescreen 21:9 o 16:9) */
  .hero-banner {
    padding: 40px 24px 20px 24px;
    max-width: 1600px;
    margin: 0 auto;
    transition: opacity 0.5s ease, height 0.5s ease, padding 0.5s ease;
  }

  .hero-slider-container {
    position: relative;
    width: 100%;
    background-color: var(--bg-card);
    border-radius: 24px;
    overflow: hidden;
    aspect-ratio: 21/9; /* Proporción horizontal de cine perfecta */
    min-height: 250px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    border: 1px solid var(--glass-border);
  }

  .hero-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    z-index: 1;
    transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
    background-size: cover;
    background-position: center 30%; /* Centra y recorta horizontalmente el póster de forma espectacular */
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 40px;
    text-decoration: none;
    color: #fff;
  }

  .hero-slide.active {
    opacity: 1;
    z-index: 2;
  }

  /* Degradado premium para que el póster recortado se desvanezca perfectamente y resalte el texto */
  .hero-slide::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to right, rgba(6, 6, 10, 0.95) 0%, rgba(6, 6, 10, 0.6) 40%, rgba(6, 6, 10, 0.2) 70%, rgba(6, 6, 10, 0.9) 100%);
    z-index: 1;
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 3;
    max-width: 650px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transform: translateY(10px);
    transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .hero-slide.active .hero-content {
    transform: translateY(0);
  }

  .hero-badge {
    background: var(--primary-gradient);
    align-self: flex-start;
    padding: 6px 14px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    box-shadow: 0 4px 15px rgba(255, 42, 84, 0.4);
  }

  .hero-content h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 36px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  .hero-content p {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.5;
    max-width: 500px;
    text-shadow: 0 1px 5px rgba(0,0,0,0.5);
  }

  /* Botón interactivo de reproducción dentro del banner */
  .hero-btn {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    color: #06060a;
    padding: 10px 24px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    margin-top: 5px;
  }

  .hero-btn svg {
    width: 14px;
    height: 14px;
    fill: #06060a;
  }

  .hero-slide:hover .hero-btn {
    background: #ff2a54;
    color: #fff;
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(255, 42, 84, 0.3);
  }

  .hero-slide:hover .hero-btn svg {
    fill: #ffffff;
  }

  /* Indicadores inferiores del Slider (Dots) */
  .slider-dots {
    position: absolute;
    bottom: 24px;
    right: 40px;
    display: flex;
    gap: 8px;
    z-index: 10;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.25);
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .dot.active {
    background: #ff2a54;
    width: 24px;
    border-radius: 10px;
  }

  /* Catálogo Grid */
  .section-title {
    max-width: 1600px;
    margin: 30px auto 10px auto;
    padding: 0 24px;
    font-family: 'Outfit', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 24px;
    background: var(--primary-gradient);
    border-radius: 4px;
  }

  .movies {
    display: grid;
    grid-template-columns: repeat(2, 1fr); /* 2 Columnas Premium en Móviles */
    gap: 16px;
    padding: 10px 24px 60px 24px;
    max-width: 1600px;
    margin: 0 auto;
    transition: all 0.3s ease;
  }

  /* Cartas de Película Estilo Premium Glass */
  .movie-card {
    position: relative;
    background-size: cover;
    background-position: center;
    aspect-ratio: 2/3;
    border-radius: var(--card-radius);
    cursor: pointer;
    display: block;
    text-decoration: none;
    overflow: hidden;
    background-color: var(--bg-card);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Hover espectacular en 3D / Brillo */
  .movie-card:hover {
    transform: translateY(-8px) scale(1.03);
    border-color: rgba(255, 42, 84, 0.4);
    box-shadow: 0 15px 30px rgba(255, 42, 84, 0.2);
    z-index: 5;
  }

  /* Degradado inferior premium para legibilidad del título */
  .movie-card::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0; top: 0;
    background: linear-gradient(to top, rgba(6, 6, 10, 0.95) 0%, rgba(6, 6, 10, 0.4) 35%, transparent 70%);
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  /* Información de la película dentro de la tarjeta */
  .movie-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transform: translateY(0);
    transition: transform 0.3s ease;
  }

  .movie-info h3 {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Etiqueta de Calidad Ultra-Pulida */
  .movie-card .quality-tag {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--glass-bg);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
    z-index: 15;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }

  /* Modificar el color de fondo de calidad si es 4K */
  .movie-card .quality-tag.high-quality {
    background: var(--primary-gradient);
    border-color: transparent;
  }

  /* Footer Minimalista */
  footer {
    border-top: 1px solid var(--glass-border);
    padding: 30px;
    text-align: center;
    background: #09090e;
    color: var(--text-muted);
    font-size: 13px;
  }

  footer a {
    color: #ff2a54;
    text-decoration: none;
    font-weight: 600;
  }

  /* ==========================================================================
     REGLAS ULTRA-RESPONSIVE ADAPTADAS PARA MÓVILES, TABLETS, PC Y SMART TVS 4K
     ========================================================================== */

  /* Móviles Pequeños */
  @media (max-width: 480px) {
    header {
      padding: 12px 16px;
      flex-direction: column;
      gap: 12px;
    }
    .hero-banner {
      padding: 16px 16px 10px 16px;
    }
    .hero-slider-container {
      aspect-ratio: 16/9; /* Proporción ideal de banner en vertical para móviles */
    }
    .hero-slide {
      padding: 24px;
    }
    .hero-badge {
      font-size: 9px;
      padding: 4px 10px;
    }
    .hero-content h1 {
      font-size: 20px;
    }
    .hero-content p {
      font-size: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-btn {
      font-size: 11px;
      padding: 8px 16px;
    }
    .slider-dots {
      bottom: 16px;
      right: 24px;
    }
    .movies {
      padding: 10px 16px 40px 16px;
      gap: 12px;
    }
    .section-title {
      padding: 0 16px;
    }
  }

  /* Tablets (e.g. iPad, etc.) */
  @media (min-width: 768px) {
    header {
      padding: 16px 32px;
    }
    .hero-banner {
      padding: 30px 32px 15px 32px;
    }
    .hero-slider-container {
      aspect-ratio: 16/7; /* Ajuste panorámico proporcional */
    }
    .movies {
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      padding: 15px 32px 60px 32px;
    }
    .section-title {
      padding: 0 32px;
      font-size: 26px;
    }
  }

  /* Laptops y PCs de Escritorio Estándar (1080p) */
  @media (min-width: 1200px) {
    .movies {
      grid-template-columns: repeat(6, 1fr);
      gap: 24px;
    }
    header {
      padding: 20px 60px;
    }
    .hero-banner {
      padding: 40px 60px 20px 60px;
    }
    .section-title {
      padding: 0 60px;
      font-size: 30px;
    }
    .movies {
      padding: 15px 60px 80px 60px;
    }
  }

  /* Smart TVs Grandes y Pantallas Ultra-Wide / 4K (Escalamiento perfecto de interfaz) */
  @media (min-width: 1800px) {
    header {
      padding: 30px 80px;
      gap: 40px;
    }
    header .logo {
      font-size: 42px;
    }
    header .logo::after {
      font-size: 42px;
      right: -15px;
    }
    .search-wrapper {
      max-width: 700px;
    }
    .search-wrapper svg {
      width: 28px;
      height: 28px;
      left: 24px;
    }
    header input {
      padding: 18px 24px 18px 68px;
      font-size: 20px;
      border-radius: 60px;
    }
    .marquee {
      font-size: 18px;
      padding: 14px 0;
    }
    .hero-banner {
      padding: 50px 80px 30px 80px;
    }
    .hero-slider-container {
      aspect-ratio: 21/8;
      border-radius: 36px;
    }
    .hero-slide {
      padding: 60px;
    }
    .hero-badge {
      font-size: 13px;
      padding: 8px 18px;
    }
    .hero-content h1 {
      font-size: 54px;
      max-width: 800px;
    }
    .hero-content p {
      font-size: 20px;
      max-width: 700px;
    }
    .hero-btn {
      font-size: 16px;
      padding: 14px 32px;
    }
    .slider-dots {
      bottom: 40px;
      right: 60px;
      gap: 12px;
    }
    .dot {
      width: 12px;
      height: 12px;
    }
    .dot.active {
      width: 32px;
    }
    .section-title {
      padding: 0 80px;
      font-size: 38px;
      margin-top: 50px;
      gap: 15px;
    }
    .section-title::before {
      width: 6px;
      height: 38px;
    }
    .movies {
      grid-template-columns: repeat(8, 1fr); /* 8 Columnas en Smart TVs para espectacular despliegue */
      gap: 32px;
      padding: 20px 80px 100px 80px;
    }
    .movie-card {
      border-radius: 20px;
    }
    .movie-info h3 {
      font-size: 18px;
    }
    .movie-card .quality-tag {
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 10px;
      top: 16px;
      right: 16px;
    }
    footer {
      font-size: 18px;
      padding: 50px;
    }
  }
</style>

<body>

<header>
  <div class="logo-container">
    <div class="logo">FILMBOX</div>
  </div>
  <div class="search-wrapper">
    <!-- Icono de lupa elegante integrado en SVG pura -->
    <svg viewBox="0 0 24 24">
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
    <input type="text" id="search" placeholder="Busca títulos, géneros, estrenos...">
  </div>
</header>

<div class="marquee">
  <span>⚡ <strong>MÁS DE 50 NUEVOS ESTRENOS AGREGADOS ESTA SEMANA</strong> • CALIDAD ULTRA HD DISPONIBLE • DISFRUTA SIN ANUNCIOS MOLESTOS • FILMBOX ⚡</span>
</div>

<!-- Carrusel de Estrenos Dinámicos (Horizontal) -->
<section class="hero-banner" id="heroBannerSection">
  <div class="hero-slider-container" id="heroSlider">
    <!-- Los slides dinámicos se cargarán aquí por JS -->
  </div>
</section>

<div class="section-title">Catálogo Completo</div>

<section class="movies" id="movieList">
  <!-- Las películas se cargarán aquí -->
</section>

<footer>
  <p>© 2026 <a href="#">FILMBOX</a> - Todos los derechos reservados. Vive la experiencia del cine.</p>
</footer>

<!-- Scripts (Tus funciones originales y lógica del carrusel añadidas de forma transparente) -->
<script>
const movieList = document.getElementById('movieList');
const searchInput = document.getElementById('search');
const heroBannerSection = document.getElementById('heroBannerSection');
const heroSlider = document.getElementById('heroSlider');
let moviesData = [];
let currentSlideIndex = 0;
let slideInterval;

// Cargar JSON
fetch('Peliculas.json')
  .then(response => response.json())
  .then(data => {
    moviesData = data;
    renderMovies(moviesData);
    renderHeroSlider(moviesData);
  })
  .catch(error => {
    console.error("Error cargando películas:", error);
  });

// Función para inicializar y rotar el carrusel dinámico de estrenos horizontales
function renderHeroSlider(movies) {
  if (!movies || movies.length === 0) return;
  
  // Seleccionamos las primeras 5 películas para destacarlas en el banner horizontal
  const featuredMovies = movies.slice(0, 5);
  heroSlider.innerHTML = '';
  
  // Generamos los slides
  featuredMovies.forEach((movie, index) => {
    const slide = document.createElement('a');
    slide.className = `hero-slide ${index === 0 ? 'active' : ''}`;
    slide.href = movie.link;
    slide.style.backgroundImage = `url('${movie.poster}')`;
    
    // Contenido legible para el slide
    const content = document.createElement('div');
    content.className = 'hero-content';
    
    const badge = document.createElement('span');
    badge.className = 'hero-badge';
    badge.textContent = movie.quality || 'NUEVO ESTRENO';
    
    const title = document.createElement('h1');
    title.textContent = movie.title;
    
    const desc = document.createElement('p');
    desc.textContent = `Ya disponible en excelente calidad de transmisión. Presiona para ver la película instantáneamente sin esperas.`;
    
    const playBtn = document.createElement('span');
    playBtn.className = 'hero-btn';
    playBtn.innerHTML = `
      <svg viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
      Ver Ahora
    `;
    
    content.appendChild(badge);
    content.appendChild(title);
    content.appendChild(desc);
    content.appendChild(playBtn);
    slide.appendChild(content);
    heroSlider.appendChild(slide);
  });
  
  // Generamos los indicadores inferiores (dots)
  const dotsContainer = document.createElement('div');
  dotsContainer.className = 'slider-dots';
  
  featuredMovies.forEach((_, index) => {
    const dot = document.createElement('div');
    dot.className = `dot ${index === 0 ? 'active' : ''}`;
    dot.addEventListener('click', (e) => {
      e.preventDefault();
      goToSlide(index);
    });
    dotsContainer.appendChild(dot);
  });
  
  heroSlider.appendChild(dotsContainer);
  
  // Iniciamos la rotación automática cada 5 segundos (5000ms)
  startSlideShow();
}

function startSlideShow() {
  clearInterval(slideInterval);
  slideInterval = setInterval(() => {
    const slides = document.querySelectorAll('.hero-slide');
    if (slides.length === 0) return;
    let nextIndex = (currentSlideIndex + 1) % slides.length;
    goToSlide(nextIndex);
  }, 5000);
}

function goToSlide(index) {
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.dot');
  if (slides.length === 0) return;
  
  slides[currentSlideIndex].classList.remove('active');
  dots[currentSlideIndex].classList.remove('active');
  
  currentSlideIndex = index;
  
  slides[currentSlideIndex].classList.add('active');
  dots[currentSlideIndex].classList.add('active');
  
  // Reiniciar temporizador al cambiar manualmente
  startSlideShow();
}

// Función para mostrar películas del catálogo
function renderMovies(movies) {
  movieList.innerHTML = '';
  movies.forEach(movie => {
    const a = document.createElement('a');
    a.className = 'movie-card';
    a.href = movie.link;
    a.dataset.title = movie.title;
    a.style.backgroundImage = `url('${movie.poster}')`;

    // Etiqueta de calidad premium
    const span = document.createElement('span');
    const quality = movie.quality || 'HD';
    span.className = 'quality-tag';
    if (quality.toLowerCase().includes('4k') || quality.toLowerCase().includes('uhd')) {
      span.classList.add('high-quality');
    }
    span.textContent = quality;

    // Contenedor de información para el título dentro de la tarjeta
    const infoDiv = document.createElement('div');
    infoDiv.className = 'movie-info';
    
    const h3 = document.createElement('h3');
    h3.textContent = movie.title;

    infoDiv.appendChild(h3);
    a.appendChild(span);
    a.appendChild(infoDiv);
    movieList.appendChild(a);
  });
}

// Lógica de búsqueda e historial (Tu código original con optimización de visibilidad del Banner)
let isSearching = false;

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase();

  if (q.length > 0 && !isSearching) {
    history.pushState({ search: true }, '');
    isSearching = true;
  }

  // Ocultar banner durante búsquedas activas para priorizar resultados de catálogo
  if (q.length > 0) {
    heroBannerSection.style.display = 'none';
  } else {
    heroBannerSection.style.display = 'block';
    isSearching = false;
    searchInput.blur();
  }

  const filtered = moviesData.filter(movie =>
    movie.title.toLowerCase().includes(q)
  );

  renderMovies(filtered);
});

window.addEventListener('popstate', () => {
  if (isSearching || searchInput.value !== '') {
    searchInput.value = '';
    renderMovies(moviesData);
    heroBannerSection.style.display = 'block';
    isSearching = false;
    searchInput.blur();
    history.pushState({ search: false }, '');
  }
});

// Scroll persistence
window.addEventListener("beforeunload", () => {
  sessionStorage.setItem("scrollPos", window.scrollY);
});

window.addEventListener("load", () => {
  const scrollPos = sessionStorage.getItem("scrollPos");
  if (scrollPos) {
    setTimeout(() => { window.scrollTo(0, parseInt(scrollPos)); }, 100);
  }
});
</script>
